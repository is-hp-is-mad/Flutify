[package]
name = "flutify_core"
version = "0.1.0"
edition = "2021"
description = "Flutify 的 Rust 核心（试点：LRC 歌词解析），后续通过 flutter_rust_bridge 供 Dart 调用"
publish = false

[lib]
name = "rust_lib_flutify"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
num-bigint = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "gzip", "deflate", "stream", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
webpki-roots = "0.26"
zhconv = { version = "0.4.2", default-features = false, features = ["opencc-hans", "opencc-hant"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
