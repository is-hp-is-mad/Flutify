# 工作分支验证：Rust 单测 + clippy、Dart 静态检查（只在 error 时失败）+ flutter test。不打包、不发布。
name: Verify

on:
  # workflow_dispatch 需要文件在默认分支上，这里改为只在指定工作分支推送时运行
  push:
    branches: ['fix/hyper-glass-preview-edges', 'rustify/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  # 先跑 flutter_rust_bridge 代码生成，后面两个 job 用生成结果编译测试，
  # 避免与 frb-codegen 并发时拿到过期的 frb_generated.rs / lib/src/rust。
  codegen:
    name: FRB codegen
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        id: frb-bin
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: frb-codegen-2.13.0-${{ runner.os }}
      - if: steps.frb-bin.outputs.cache-hit != 'true'
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - run: flutter pub get
      - run: flutter_rust_bridge_codegen generate
      - name: Report stale committed bindings
        run: |
          if ! git diff --quiet -- lib/src/rust rust/flutify_core/src; then
            echo "::warning::committed FRB bindings are stale; run frb-codegen on this branch"
            git diff --stat -- lib/src/rust rust/flutify_core/src
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frb-generated
          path: |
            lib/src/rust
            rust/flutify_core/src/frb_generated.rs
          retention-days: 1

  rust:
    name: Rust test & clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: codegen
    defaults:
      run:
        working-directory: rust/flutify_core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frb-generated
          path: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/flutify_core
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings

  dart:
    name: Dart analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frb-generated
          path: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Check l10n ARB files
        run: python3 tool/check_l10n.py
      - run: flutter pub get
      - name: Analyze (fail on errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - run: flutter test
