# Independent, secret-free CI. Artifacts are not official releases.
name: Self-test

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'
  FLUTTER_VERSION_MACOS: '3.44.9'

jobs:
  scope:
    name: Select native checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos_titlebar: ${{ steps.scope.outputs.macos_titlebar }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node tool/self_test_scope.cjs

  macos-titlebar:
    name: macOS native titlebar hit testing
    needs: scope
    # Only an explicit, successful false may skip this independent native test.
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.macos_titlebar != 'false') }}
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check native button hit regions and Flutter content access
        run: |
          swiftc macos/Runner/TrafficLightAligner.swift tool/test_macos_titlebar.swift -o "$RUNNER_TEMP/titlebar-test"
          "$RUNNER_TEMP/titlebar-test"

  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Existing informational lints are reported; errors and warnings still fail.
      # Standalone diagnostic scripts in tool/ are outside the app analysis scope.
      - run: flutter analyze --no-pub --no-fatal-infos lib test
      - run: node --test tool/test_*.cjs
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter test --no-pub

  android:
    name: Android self-test APKs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_BUILD_NUMBER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch flutter_inappwebview_android for AGP 9
        run: |
          root=$(grep -o '"rootUri": *"file://[^"]*flutter_inappwebview_android-[^"]*"' .dart_tool/package_config.json \
            | sed -E 's/.*"file:\/\/([^"]*)"/\1/')
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$root/android/build.gradle"
          grep -n "proguard" "$root/android/build.gradle"
      - name: Create temporary self-test signing key
        run: bash tool/create_self_test_android_key.sh
      - name: Compile release-mode self-test APKs
        run: |
          flutter build apk --release --no-pub --split-per-abi --build-number="$ANDROID_BUILD_NUMBER"
          flutter build apk --release --no-pub --build-number="$ANDROID_BUILD_NUMBER"
      - name: Verify signatures, version codes and media icons
        run: python3 tool/verify_android_apks.py build/app/outputs/flutter-apk "$ANDROID_BUILD_NUMBER"
      - name: Remove temporary self-test key
        if: always()
        run: rm -f "$RUNNER_TEMP/flutify-self-test.p12"
      - name: Label self-test artifacts
        run: |
          mkdir -p dist/android
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            cp "$apk" "dist/android/Flutify-self-test-${GITHUB_SHA:0:7}-${apk##*/}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: self-test-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS self-test
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION_MACOS }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub
      - run: flutter build macos --release --no-pub
      - name: Package self-test app
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/Flutify.app "dist/Flutify-self-test-${GITHUB_SHA:0:7}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: self-test-macos
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows ${{ matrix.arch }} self-test
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: ${{ matrix.arch }}
      # This SDK version has no prebuilt Windows ARM64 archive.
      - name: Bootstrap native Flutter SDK on Windows ARM64
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'Expected native ARM64 runner shell' }
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-arm64'
          git clone --depth 1 --branch $env:FLUTTER_VERSION https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Flutter clone failed' }
          $revision = git -C $sdk rev-parse HEAD
          if ($revision -ne '559ffa3f75e7402d65a8def9c28389a9b2e6fe42') { throw 'Unexpected Flutter 3.44.0 revision' }
          & "$sdk/bin/flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { throw 'Flutter bootstrap failed' }
          $dartVersion = & "$sdk/bin/dart.bat" --version 2>&1
          if ($dartVersion -notmatch 'windows_arm64') { throw "Expected ARM64 Dart: $dartVersion" }
          "$sdk/bin" >> $env:GITHUB_PATH
      - run: flutter pub get
      - name: Test Windows PowerShell 5.1 update handoff
        run: python tool/test_windows_update.py -v
      - run: flutter build windows --release --no-pub --dart-define=FLUTIFY_NATIVE_WIDEVINE=${{ matrix.arch == 'x64' }}
      - name: Verify native binary architecture
        run: python tool/verify_windows_arch.py build/windows/${{ matrix.arch }}/runner/Release ${{ matrix.arch }}
      - name: Verify app-local VC runtime dependencies
        shell: pwsh
        run: ./tool/verify_windows_runtime.ps1 -Directory build/windows/${{ matrix.arch }}/runner/Release -BuildDirectory build/windows/${{ matrix.arch }}
      - name: Package self-test portable bundle
        shell: pwsh
        run: |
          $source = "build/windows/$env:BUILD_ARCH/runner/Release"
          if (!(Test-Path "$source/Flutify.exe") -or !(Test-Path "$source/data/app.so")) { throw 'Missing release application' }
          $stage = "dist/self-test-windows-$env:BUILD_ARCH"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Get-ChildItem -LiteralPath $source -File | Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination $stage
          Copy-Item -LiteralPath "$source/data" -Destination $stage -Recurse
          if (Test-Path "$source/native_assets.json") { Copy-Item "$source/native_assets.json" -Destination $stage }
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Flutify-self-test-$($env:GITHUB_SHA.Substring(0,7))-windows-$env:BUILD_ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: self-test-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
